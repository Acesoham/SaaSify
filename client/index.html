<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ───────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ── Primary SEO (updated per-page via <title> in components) ── -->
    <title>SaaSify – Project & Task Management for Modern Teams</title>
    <meta name="description" content="SaaSify is a multi-tenant project and task management platform. Kanban boards, real-time collaboration, analytics, and DevOps deployments — all in one place." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#171820" />

    <!-- ── Open Graph ────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="SaaSify" />
    <meta property="og:title"       content="SaaSify – Project & Task Management for Modern Teams" />
    <meta property="og:description" content="Multi-tenant project and task management. Kanban boards, real-time collaboration, analytics, and DevOps deployments in one platform." />
    <meta property="og:image"       content="/favicon.png" />

    <!-- ── Twitter Card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="SaaSify – Project & Task Management for Modern Teams" />
    <meta name="twitter:description" content="Multi-tenant project and task management. Kanban boards, real-time collaboration, analytics, and DevOps deployments." />
    <meta name="twitter:image"       content="/favicon.png" />

    <!-- ── Fonts ────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>

  </body>
